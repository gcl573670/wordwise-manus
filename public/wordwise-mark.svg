<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">F and W monogram with copper accent</title>
  <desc id="desc">A dramatic overlapping F and W monogram in deep teal on a black background, with a small copper accent and soft teal and amber glow.</desc>
  <defs>
    <radialGradient id="tealGlow" cx="31%" cy="48%" r="47%">
      <stop offset="0" stop-color="#00a99d" stop-opacity=".34"/>
      <stop offset=".48" stop-color="#006d68" stop-opacity=".20"/>
      <stop offset="1" stop-color="#001b1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rightGlow" cx="76%" cy="47%" r="36%">
      <stop offset="0" stop-color="#006d68" stop-opacity=".19"/>
      <stop offset="1" stop-color="#001b1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="copperGlow" cx="49%" cy="51%" r="19%">
      <stop offset="0" stop-color="#e98a32" stop-opacity=".46"/>
      <stop offset=".55" stop-color="#b96524" stop-opacity=".17"/>
      <stop offset="1" stop-color="#b96524" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08736e" stop-opacity="1"/>
      <stop offset="1" stop-color="#003d3b" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="wFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#063c3b" stop-opacity="1"/>
      <stop offset="1" stop-color="#001b1b" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d98236"/>
      <stop offset="1" stop-color="#b95d22"/>
    </linearGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>
  <rect width="1536" height="1024" fill="url(#tealGlow)"/>
  <rect width="1536" height="1024" fill="url(#rightGlow)"/>
  <rect width="1536" height="1024" fill="url(#copperGlow)"/>
  <ellipse cx="744" cy="535" rx="105" ry="90" fill="#bd6a29" opacity=".19" filter="url(#softBlur)"/>

  <!-- F: broad, sculptural left-hand letter -->
  <path d="M188 228 H837 L778 327 C775 300 759 286 729 286 H438 C404 286 387 306 387 340 V398 H721 L681 454 C672 468 659 474 639 474 H439 C405 474 387 493 387 528 V666 C387 714 417 748 477 770 H170 C230 748 258 714 258 666 V331 C258 282 234 250 188 228 Z" fill="url(#fFill)"/>

  <!-- W: dark, angular letterform crossing the F -->
  <path d="M1174 228 H1409 C1360 250 1328 282 1306 326 L1078 785 L938 337 L745 810 L549 518 H637 C660 518 679 529 692 550 L758 625 L938 337 L1078 785 L1174 228 Z" fill="url(#wFill)" opacity=".88"/>
  <path d="M1174 228 H1409 C1360 250 1328 282 1306 326" fill="none" stroke="#0a4a47" stroke-opacity=".23" stroke-width="3"/>

  <!-- Copper inset at the central junction -->
  <path d="M678 518 H716 C747 518 771 532 790 559 L759 624 Z" fill="url(#copper)"/>
  <path d="M678 518 H716 C747 518 771 532 790 559" fill="none" stroke="#e49a4e" stroke-opacity=".45" stroke-width="2"/>
</svg>
