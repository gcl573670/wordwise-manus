<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">F and W monogram with copper accent</title>
  <desc id="desc">A solid teal F overlapping a complete angular teal W, with a copper accent and subtle transparent glow.</desc>
  <defs>
    <radialGradient id="tealGlow" cx="31%" cy="48%" r="47%">
      <stop offset="0" stop-color="#00a99d" stop-opacity=".20"/>
      <stop offset=".48" stop-color="#006d68" stop-opacity=".10"/>
      <stop offset="1" stop-color="#001b1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="copperGlow" cx="49%" cy="51%" r="19%">
      <stop offset="0" stop-color="#e98a32" stop-opacity=".30"/>
      <stop offset=".55" stop-color="#b96524" stop-opacity=".10"/>
      <stop offset="1" stop-color="#b96524" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08736e"/>
      <stop offset="1" stop-color="#003d3b"/>
    </linearGradient>
    <linearGradient id="wStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07504c"/>
      <stop offset="1" stop-color="#001b1b"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e49342"/>
      <stop offset="1" stop-color="#b95d22"/>
    </linearGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <!-- Soft glows only; no background rectangle, so the canvas is transparent. -->
  <rect width="1536" height="1024" fill="url(#tealGlow)"/>
  <rect width="1536" height="1024" fill="url(#copperGlow)"/>
  <ellipse cx="744" cy="535" rx="105" ry="90" fill="#bd6a29" opacity=".12" filter="url(#softBlur)"/>

  <!-- F -->
  <path d="M188 228 H837 L778 327 C775 300 759 286 729 286 H438 C404 286 387 306 387 340 V398 H721 L681 454 C672 468 659 474 639 474 H439 C405 474 387 493 387 528 V666 C387 714 417 748 477 770 H170 C230 748 258 714 258 666 V331 C258 282 234 250 188 228 Z" fill="url(#fFill)"/>

  <!-- Complete W: one continuous angular stroke, kept distinct from the F. -->
  <path d="M590 270 L760 735 L940 385 L1115 735 L1375 270"
        fill="none" stroke="url(#wStroke)" stroke-width="132"
        stroke-linecap="butt" stroke-linejoin="miter"/>

  <!-- Copper accent at the central junction -->
  <path d="M678 518 H716 C747 518 771 532 790 559 L759 624 Z" fill="url(#copper)"/>
</svg>
